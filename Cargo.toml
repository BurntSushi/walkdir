[package]
name = "walkdir"
version = "2.5.0"  #:version
authors = ["Andrew Gallant <jamslam@gmail.com>"]
description = "Recursively walk a directory."
documentation = "https://docs.rs/walkdir/"
homepage = "https://github.com/BurntSushi/walkdir"
repository = "https://github.com/BurntSushi/walkdir"
readme = "README.md"
keywords = ["directory", "recursive", "walk", "iterator"]
categories = ["filesystem"]
license = "Unlicense/MIT"
exclude = ["/ci/*", "/.travis.yml", "/appveyor.yml"]
edition = "2018"

[badges]
travis-ci = { repository = "BurntSushi/walkdir" }
appveyor = { repository = "BurntSushi/walkdir" }

[workspace]
members = ["walkdir-list"]

[dependencies]
cap-std = { version = "4.0.2", default-features = false }
same-file = "1.0.1"

[target.'cfg(not(windows))'.dependencies.rustix]
# cap-std's dependency tree still permits old rustix 0.38 releases under
# minimal-versions. rustix 0.38.0 does not build on current nightly.
version = "0.38.44"
default-features = false

[target.'cfg(windows)'.dependencies.winapi-util]
version = "0.1.1"

[dev-dependencies]
doc-comment = "0.3"
libc = "0.2.186"
